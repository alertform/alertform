name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Colours must be %23-encoded: snk interpolates the raw value straight
      # into CSS, so a bare "CC785C" yields an invalid declaration.
      - name: Render snake in the Claude palette
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg?color_snake=%23CC785C&color_dots=%23262625,%236C5F4E,%23A87F63,%23D4A27F,%23EBDBBC
            dist/snake-light.svg?color_snake=%23CC785C&color_dots=%23F0EEE6,%23EBDBBC,%23D4A27F,%23A87F63,%23CC785C

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
